name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: php --version
      - run: node --test tests/*.test.js
      - run: php -l extension/terminal.template.php
      - run: python tests/php_integration.py
      - run: python tests/php_restricted_host.py
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-terminal-browser-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish browser packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "Harbor Terminal $GITHUB_REF_NAME" --notes "Chrome/Edge: unpacked development build. Firefox: unsigned temporary testing build; Mozilla signing is required for permanent installation. See README for installation and update instructions."
          fi
